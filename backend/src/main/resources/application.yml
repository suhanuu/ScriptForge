server:
  port: 8080

spring:
  application:
    name: scriptforge

  datasource:
    url: jdbc:sqlite:data/scriptforge.db
    driver-class-name: org.sqlite.JDBC

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml
