server:
  port: 8080

spring:
  application:
    name: scriptforge

  datasource:
    url: jdbc:sqlite:data/scriptforge.db
    driver-class-name: org.sqlite.JDBC

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml

scriptforge:
  llm:
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
    model: ${LLM_MODEL:deepseek-chat}
    timeout-seconds: 120
    max-retries: 2

logging:
  file:
    path: logs
